services:
  # Service 1: Database PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: perpustakaan_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_perpustakaan_upnvj
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Service 2: Express Backend App
  web-app:
    build: .
    container_name: perpustakaan_app_container
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:password123@postgres-db:5432/db_perpustakaan_upnvj  
      JWT_SECRET: super_secret_key_didan_larp
    depends_on:
      - postgres-db

volumes:
  pgdata: